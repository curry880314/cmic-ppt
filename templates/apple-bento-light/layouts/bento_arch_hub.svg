  <g id="bento-page-slot" data-pptx-placeholder="slide-number" data-pptx-idx="4" data-pptx-bounds="1192 686 48 28">
    <text id="bento-page-carrier" data-pptx-carrier="true" x="1240" y="706" text-anchor="end" fill="#94A3B8" font-family="Arial, sans-serif" font-size="13" font-weight="700">{{PAGE_NUM}}</text>
  </g>
</svg>
