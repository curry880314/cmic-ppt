<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
  lang="zh-CN" width="1280" height="720" viewBox="0 0 1280 720"
  font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif"
  data-pptx-master="bento_content_master" data-pptx-master-name="Bento Content Master"
  data-pptx-layout="content" data-pptx-layout-name="Bento Content">
  <rect id="bento-bg" x="0" y="0" width="1280" height="720" fill="#F5F5F7" data-pptx-layer="master" data-pptx-editable="false"/>

  <g id="bento-kicker-slot" data-pptx-placeholder="body" data-pptx-idx="1" data-pptx-bounds="40 20 360 28">
    <text id="bento-kicker-carrier" data-pptx-carrier="true" x="40" y="40" fill="#2563EB" font-size="13" font-weight="700">{{KICKER}}</text>
  </g>
  <g id="bento-title-slot" data-pptx-placeholder="title" data-pptx-bounds="40 46 1160 44">
    <text id="bento-title-carrier" data-pptx-carrier="true" x="40" y="80" fill="#0F172A" font-size="28" font-weight="700">{{TITLE}}</text>
  </g>
  <g id="bento-takeaway-slot" data-pptx-placeholder="body" data-pptx-idx="2" data-pptx-bounds="40 94 1200 58">
    <text id="bento-takeaway-carrier" data-pptx-carrier="true" x="40" y="116" fill="#475569" font-size="16" font-weight="700">{{TAKEAWAY}}</text>
  </g>

  <g id="bento-object-slot" data-pptx-placeholder="object" data-pptx-idx="3" data-pptx-binding="proxy" data-pptx-bounds="40 160 1200 524">
    <!-- 左：上游生态卡 -->
    <rect x="40" y="164" width="320" height="396" rx="22" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2" />
    <text x="68" y="200" font-size="13" font-weight="700" fill="#2563EB">{{L_TAG}}</text>
    <text x="68" y="232" font-size="21" font-weight="700" fill="#0F172A">{{L_TITLE}}</text>
    <rect x="68" y="256" width="264" height="54" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <text x="200" y="289" font-size="16" font-weight="700" fill="#1E293B" text-anchor="middle">{{L_I1}}</text>
    <rect x="68" y="322" width="264" height="54" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <text x="200" y="355" font-size="16" font-weight="700" fill="#1E293B" text-anchor="middle">{{L_I2}}</text>
    <rect x="68" y="388" width="264" height="54" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <text x="200" y="421" font-size="16" font-weight="700" fill="#1E293B" text-anchor="middle">{{L_I3}}</text>
    <rect x="68" y="454" width="264" height="54" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <text x="200" y="487" font-size="16" font-weight="700" fill="#1E293B" text-anchor="middle">{{L_I4}}</text>
    <text x="200" y="540" font-size="13" fill="#64748B" text-anchor="middle">{{L_FOOT}}</text>

    <!-- 箭头1 -->
    <polygon points="368,354 388,354 388,344 404,362 388,380 388,370 368,370" fill="#2563EB" />

    <!-- 中：深黑 IDaaS 核心英雄中枢 -->
    <rect x="412" y="164" width="456" height="396" rx="24" fill="#0F172A" />
    <rect x="440" y="188" width="160" height="28" rx="14" fill="#1D4ED8" />
    <text x="520" y="207" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">{{HUB_TAG}}</text>
    <text x="440" y="254" font-size="26" font-weight="700" fill="#FFFFFF">{{HUB_TITLE}}</text>
    <text x="440" y="284" font-size="14.5" fill="#94A3B8">{{HUB_SUB}}</text>

    <!-- 四步链路胶囊 -->
    <rect x="440" y="310" width="92" height="58" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="486" y="345" font-size="14" font-weight="700" fill="#60A5FA" text-anchor="middle">{{H1}}</text>
    <rect x="542" y="310" width="92" height="58" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="588" y="345" font-size="14" font-weight="700" fill="#60A5FA" text-anchor="middle">{{H2}}</text>
    <rect x="644" y="310" width="92" height="58" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="690" y="345" font-size="14" font-weight="700" fill="#60A5FA" text-anchor="middle">{{H3}}</text>
    <rect x="746" y="310" width="94" height="58" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="793" y="345" font-size="14" font-weight="700" fill="#60A5FA" text-anchor="middle">{{H4}}</text>

    <line x1="440" y1="394" x2="840" y2="394" stroke="#1E293B" stroke-width="1.2" />
    <text x="440" y="422" font-size="13" font-weight="700" fill="#94A3B8">四大统一治理底座</text>

    <rect x="440" y="438" width="194" height="44" rx="10" fill="#172554" stroke="#1D4ED8" stroke-width="1" />
    <text x="537" y="466" font-size="14" font-weight="700" fill="#E0F2FE" text-anchor="middle">{{U1}}</text>
    <rect x="646" y="438" width="194" height="44" rx="10" fill="#172554" stroke="#1D4ED8" stroke-width="1" />
    <text x="743" y="466" font-size="14" font-weight="700" fill="#E0F2FE" text-anchor="middle">{{U2}}</text>
    <rect x="440" y="492" width="194" height="44" rx="10" fill="#172554" stroke="#1D4ED8" stroke-width="1" />
    <text x="537" y="520" font-size="14" font-weight="700" fill="#E0F2FE" text-anchor="middle">{{U3}}</text>
    <rect x="646" y="492" width="194" height="44" rx="10" fill="#172554" stroke="#1D4ED8" stroke-width="1" />
    <text x="743" y="520" font-size="14" font-weight="700" fill="#E0F2FE" text-anchor="middle">{{U4}}</text>

    <!-- 箭头2 -->
    <polygon points="876,354 896,354 896,344 912,362 896,380 896,370 876,370" fill="#2563EB" />

    <!-- 右：算力供给卡 -->
    <rect x="920" y="164" width="320" height="396" rx="22" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2" />
    <text x="948" y="200" font-size="13" font-weight="700" fill="#2563EB">{{R_TAG}}</text>
    <text x="948" y="232" font-size="21" font-weight="700" fill="#0F172A">{{R_TITLE}}</text>

    <rect x="948" y="260" width="264" height="128" rx="16" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.2" />
    <text x="970" y="298" font-size="18" font-weight="700" fill="#1D4ED8">{{R_C1_T}}</text>
    <text x="970" y="330" font-size="13.5" fill="#1E3A8A">{{R_C1_D}}</text>

    <rect x="948" y="408" width="264" height="128" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" />
    <text x="970" y="446" font-size="18" font-weight="700" fill="#0F172A">{{R_C2_T}}</text>
    <text x="970" y="478" font-size="13.5" fill="#475569">{{R_C2_D}}</text>

    <!-- 底部极简对比卡（传统配置 vs IDaaS极简） -->
    <rect x="40" y="578" width="584" height="100" rx="18" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2" />
    <rect x="64" y="608" width="108" height="38" rx="10" fill="#F1F5F9" />
    <text x="118" y="633" font-size="14" font-weight="700" fill="#64748B" text-anchor="middle">{{CMP_OLD_T}}</text>
    <text x="192" y="633" font-size="14.5" fill="#64748B">{{CMP_OLD_D}}</text>

    <rect x="640" y="578" width="600" height="100" rx="18" fill="#0F172A" />
    <rect x="664" y="608" width="132" height="38" rx="10" fill="#2563EB" />
    <text x="730" y="633" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">{{CMP_NEW_T}}</text>
    <text x="814" y="633" font-size="15.5" font-weight="700" fill="#FFFFFF">{{CMP_NEW_D}}</text>
