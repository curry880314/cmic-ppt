    <rect x="448" y="164" width="384" height="436" rx="22" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2" />
    <text x="476" y="200" font-size="12.5" font-weight="700" fill="#059669">{{C2_SUB}}</text>
    <text x="476" y="232" font-size="22" font-weight="700" fill="#0F172A">{{C2_H}}</text>
    <line x1="476" y1="252" x2="804" y2="252" stroke="#F1F5F9" stroke-width="1.5" />

    <text x="476" y="286" font-size="16" font-weight="700" fill="#0F172A">{{C2_T1}}</text>
    <text x="476" y="314" font-size="13.5" fill="#475569">{{C2_B1}}</text>
    <line x1="476" y1="358" x2="804" y2="358" stroke="#F1F5F9" stroke-width="1" />

    <text x="476" y="392" font-size="16" font-weight="700" fill="#0F172A">{{C2_T2}}</text>
    <text x="476" y="420" font-size="13.5" fill="#475569">{{C2_B2}}</text>
    <line x1="476" y1="464" x2="804" y2="464" stroke="#F1F5F9" stroke-width="1" />

    <text x="476" y="498" font-size="16" font-weight="700" fill="#0F172A">{{C2_T3}}</text>
    <text x="476" y="526" font-size="13.5" fill="#475569">{{C2_B3}}</text>

    <!-- 右深黑英雄反色卡 -->
    <rect x="856" y="164" width="384" height="436" rx="22" fill="#0F172A" />
    <text x="884" y="200" font-size="12.5" font-weight="700" fill="#60A5FA">{{C3_SUB}}</text>
    <text x="884" y="232" font-size="22" font-weight="700" fill="#FFFFFF">{{C3_H}}</text>
    <line x1="884" y1="252" x2="1212" y2="252" stroke="#1E293B" stroke-width="1.5" />

    <text x="884" y="286" font-size="16" font-weight="700" fill="#60A5FA">{{C3_T1}}</text>
    <text x="884" y="314" font-size="13.5" fill="#CBD5E1">{{C3_B1}}</text>
    <line x1="884" y1="358" x2="1212" y2="358" stroke="#1E293B" stroke-width="1" />

    <text x="884" y="392" font-size="16" font-weight="700" fill="#60A5FA">{{C3_T2}}</text>
    <text x="884" y="420" font-size="13.5" fill="#CBD5E1">{{C3_B2}}</text>
    <line x1="884" y1="464" x2="1212" y2="464" stroke="#1E293B" stroke-width="1" />

    <text x="884" y="498" font-size="16" font-weight="700" fill="#60A5FA">{{C3_T3}}</text>
    <text x="884" y="526" font-size="13.5" fill="#CBD5E1">{{C3_B3}}</text>

    <!-- 底部极简金句条 -->
    <rect x="40" y="618" width="1200" height="58" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2" />
    <text x="640" y="653" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">{{FOOTER_QUOTE}}</text>
