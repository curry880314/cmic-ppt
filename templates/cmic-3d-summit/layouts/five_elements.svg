    <text x="640" y="266" font-size="18" font-weight="700" fill="#0F2F7F" text-anchor="middle">{{E3_T}}</text>
    <text x="640" y="296" font-size="15" font-weight="700" fill="#C82018" text-anchor="middle">{{E3_SUB}}</text>
    <image href="{{ICON_3}}" x="580" y="316" width="120" height="120" preserveAspectRatio="xMidYMid meet" />
    <text x="542" y="468" font-size="13.5" fill="#1E293B">{{E3_B}}</text>

    <!-- 卡4 -->
    <rect x="772" y="228" width="228" height="392" rx="18" fill="#FFFFFF" fill-opacity="0.90" stroke="#9FD0FF" stroke-width="1.5" />
    <text x="886" y="266" font-size="18" font-weight="700" fill="#0F2F7F" text-anchor="middle">{{E4_T}}</text>
    <text x="886" y="296" font-size="15" font-weight="700" fill="#C82018" text-anchor="middle">{{E4_SUB}}</text>
    <image href="{{ICON_4}}" x="826" y="316" width="120" height="120" preserveAspectRatio="xMidYMid meet" />
    <text x="788" y="468" font-size="13.5" fill="#1E293B">{{E4_B}}</text>

    <!-- 卡5 -->
    <rect x="1018" y="228" width="228" height="392" rx="18" fill="#FFFFFF" fill-opacity="0.90" stroke="#9FD0FF" stroke-width="1.5" />
    <text x="1132" y="266" font-size="18" font-weight="700" fill="#0F2F7F" text-anchor="middle">{{E5_T}}</text>
    <text x="1132" y="296" font-size="15" font-weight="700" fill="#C82018" text-anchor="middle">{{E5_SUB}}</text>
    <image href="{{ICON_5}}" x="1072" y="316" width="120" height="120" preserveAspectRatio="xMidYMid meet" />
