    <image href="{{ICON_1}}" x="88" y="316" width="120" height="120" preserveAspectRatio="xMidYMid meet" />
    <text x="50" y="468" font-size="13.5" fill="#1E293B">{{E1_B}}</text>

    <!-- 卡2 -->
    <rect x="280" y="228" width="228" height="392" rx="18" fill="#FFFFFF" fill-opacity="0.90" stroke="#9FD0FF" stroke-width="1.5" />
    <text x="394" y="266" font-size="18" font-weight="700" fill="#0F2F7F" text-anchor="middle">{{E2_T}}</text>
    <text x="394" y="296" font-size="15" font-weight="700" fill="#C82018" text-anchor="middle">{{E2_SUB}}</text>
