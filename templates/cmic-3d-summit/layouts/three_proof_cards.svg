<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
  lang="zh-CN" width="1280" height="720" viewBox="0 0 1280 720"
  font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif"
  data-pptx-master="cmic_3d_summit_master" data-pptx-master-name="CMIC 3D Summit"
  data-pptx-layout="summit_content" data-pptx-layout-name="Summit Content">
  <defs>
    <linearGradient id="summitCardHdr1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E56C9" />
      <stop offset="100%" stop-color="#228BE6" />
    </linearGradient>
    <linearGradient id="summitCardHdr2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="summitCardHdr3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5B4CE2" />
      <stop offset="100%" stop-color="#7C6BF0" />
    </linearGradient>
  </defs>

  <image id="summit-master-bg" x="0" y="0" width="1280" height="720"
    href="../images/bg_summit_3d.png" preserveAspectRatio="none"
    data-pptx-layer="master" data-pptx-editable="false"/>

  <g id="summit-banner-slot" data-pptx-placeholder="body" data-pptx-idx="1" data-pptx-bounds="160 12 960 56">
    <text id="summit-banner-carrier" data-pptx-carrier="true" x="640" y="54" text-anchor="middle" fill="#FFFFFF" font-size="28" font-weight="700">{{BANNER_TOP}}</text>
  </g>
  <g id="summit-subbanner-slot" data-pptx-placeholder="body" data-pptx-idx="2" data-pptx-bounds="200 68 880 38">
    <text id="summit-subbanner-carrier" data-pptx-carrier="true" x="640" y="96" text-anchor="middle" fill="#E6F2FF" font-size="20" font-weight="700">{{BANNER_SUB}}</text>
  </g>
  <g id="summit-title-slot" data-pptx-placeholder="title" data-pptx-bounds="80 124 1120 84">
    <text id="summit-title-carrier" data-pptx-carrier="true" x="640" y="162" text-anchor="middle" fill="#0F2F7F" font-size="25" font-weight="700">{{HEADLINE}}</text>
  </g>

  <g id="summit-object-slot" data-pptx-placeholder="object" data-pptx-idx="3" data-pptx-binding="proxy" data-pptx-bounds="32 220 1216 476">
    <!-- 顶部三节点 3D 演进图 -->
    <image href="{{TOP_ICON_1}}" x="174" y="226" width="124" height="124" preserveAspectRatio="xMidYMid meet" />
    <line x1="336" y1="288" x2="532" y2="288" stroke="#0EA5E9" stroke-width="2.5" />
    <polygon points="530,280 548,288 530,296" fill="#0EA5E9" />

    <image href="{{TOP_ICON_2}}" x="578" y="226" width="124" height="124" preserveAspectRatio="xMidYMid meet" />
    <line x1="736" y1="288" x2="932" y2="288" stroke="#0EA5E9" stroke-width="2.5" />
    <polygon points="930,280 948,288 930,296" fill="#0EA5E9" />

    <image href="{{TOP_ICON_3}}" x="982" y="226" width="124" height="124" preserveAspectRatio="xMidYMid meet" />

    <!-- 下方三栏成果背书卡 -->
    <!-- 卡1 -->
    <rect x="46" y="372" width="376" height="304" rx="16" fill="#FFFFFF" fill-opacity="0.92" stroke="#9FD0FF" stroke-width="1.5" />
    <rect x="46" y="372" width="376" height="76" rx="16" fill="url(#summitCardHdr1)" />
    <image href="{{CARD_ICON_1}}" x="68" y="384" width="52" height="52" preserveAspectRatio="xMidYMid meet" />
    <line x1="134" y1="390" x2="134" y2="430" stroke="#93C5FD" stroke-width="1.2" />
    <text x="150" y="404" font-size="17" font-weight="700" fill="#FFFFFF">{{C1_H}}</text>
    <text x="68" y="488" font-size="14.5" font-weight="700" fill="#1E293B">{{C1_B1}}</text>
    <text x="68" y="554" font-size="14.5" font-weight="700" fill="#1E293B">{{C1_B2}}</text>
    <text x="68" y="620" font-size="14.5" font-weight="700" fill="#1E293B">{{C1_B3}}</text>

    <!-- 卡2 -->
    <rect x="452" y="372" width="376" height="304" rx="16" fill="#FFFFFF" fill-opacity="0.92" stroke="#9FD0FF" stroke-width="1.5" />
    <rect x="452" y="372" width="376" height="76" rx="16" fill="url(#summitCardHdr2)" />
    <image href="{{CARD_ICON_2}}" x="474" y="384" width="52" height="52" preserveAspectRatio="xMidYMid meet" />
    <line x1="540" y1="390" x2="540" y2="430" stroke="#BAE6FD" stroke-width="1.2" />
    <text x="556" y="404" font-size="17" font-weight="700" fill="#FFFFFF">{{C2_H}}</text>
    <text x="474" y="488" font-size="14.5" font-weight="700" fill="#1E293B">{{C2_B1}}</text>
    <text x="474" y="554" font-size="14.5" font-weight="700" fill="#1E293B">{{C2_B2}}</text>
    <text x="474" y="620" font-size="14.5" font-weight="700" fill="#1E293B">{{C2_B3}}</text>

    <!-- 卡3 -->
    <rect x="858" y="372" width="376" height="304" rx="16" fill="#FFFFFF" fill-opacity="0.92" stroke="#C4B5FD" stroke-width="1.5" />
    <rect x="858" y="372" width="376" height="76" rx="16" fill="url(#summitCardHdr3)" />
    <image href="{{CARD_ICON_3}}" x="880" y="384" width="52" height="52" preserveAspectRatio="xMidYMid meet" />
    <line x1="946" y1="390" x2="946" y2="430" stroke="#DDD6FE" stroke-width="1.2" />
    <text x="962" y="404" font-size="17" font-weight="700" fill="#FFFFFF">{{C3_H}}</text>
    <text x="880" y="488" font-size="14.5" font-weight="700" fill="#1E293B">{{C3_B1}}</text>
    <text x="880" y="554" font-size="14.5" font-weight="700" fill="#1E293B">{{C3_B2}}</text>
    <text x="880" y="620" font-size="14.5" font-weight="700" fill="#1E293B">{{C3_B3}}</text>
  </g>
</svg>
