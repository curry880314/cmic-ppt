<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
  lang="zh-CN" width="1280" height="720" viewBox="0 0 1280 720"
  font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif"
  data-pptx-master="cmic_dark_arch_master" data-pptx-master-name="CMIC Dark Arch"
  data-pptx-layout="content" data-pptx-layout-name="Dark Architecture">
  <defs>
    <linearGradient id="darkValCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#13386B" stop-opacity="0.78" />
      <stop offset="100%" stop-color="#0A1F42" stop-opacity="0.9" />
