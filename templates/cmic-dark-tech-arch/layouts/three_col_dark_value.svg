    <text x="882" y="340" font-size="13.5" fill="#DCE8F8">{{C3_B1}}</text>
    <line x1="882" y1="382" x2="1226" y2="382" stroke="#315C80" stroke-width="1" />
    <text x="882" y="414" font-size="16" font-weight="700" fill="#FFC52B">{{C3_T2}}</text>
    <text x="882" y="440" font-size="13.5" fill="#DCE8F8">{{C3_B2}}</text>
