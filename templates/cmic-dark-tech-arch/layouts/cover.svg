<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
  lang="zh-CN" width="1280" height="720" viewBox="0 0 1280 720"
  font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif"
  data-pptx-master="cmic_dark_brand_master" data-pptx-master-name="CMIC Dark Brand"
  data-pptx-layout="cover" data-pptx-layout-name="Dark Cover">
  <image id="dark-brand-bg" x="0" y="0" width="1280" height="720"
    href="../images/bg_dark_tech.png" preserveAspectRatio="none"
    data-pptx-layer="master" data-pptx-editable="false"/>

  <rect id="cover-glow-top" x="280" y="184" width="720" height="2" fill="#65BCEB" fill-opacity="0.7"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="cover-glow-bottom" x="480" y="454" width="320" height="2" fill="#FFC52B" fill-opacity="0.85"
    data-pptx-layer="layout" data-pptx-editable="false"/>

  <g id="cover-title-slot" data-pptx-placeholder="title" data-pptx-bounds="100 202 1080 140">
    <text id="cover-title-carrier" data-pptx-carrier="true" x="640" y="254" text-anchor="middle" fill="#FFFFFF" font-size="42" font-weight="700">{{TITLE}}</text>
  </g>
  <g id="cover-subtitle-slot" data-pptx-placeholder="subtitle" data-pptx-idx="1" data-pptx-bounds="160 356 960 56">
    <text id="cover-subtitle-carrier" data-pptx-carrier="true" x="640" y="396" text-anchor="middle" fill="#6ED5FF" font-size="21" font-weight="700">{{SUBTITLE}}</text>
  </g>
  <g id="cover-author-slot" data-pptx-placeholder="body" data-pptx-idx="2" data-pptx-bounds="360 482 560 44">
    <text id="cover-author-carrier" data-pptx-carrier="true" x="640" y="512" text-anchor="middle" fill="#F4F7FC" font-size="22" font-weight="700">{{AUTHOR}}</text>
  </g>
  <g id="cover-date-slot" data-pptx-placeholder="date" data-pptx-idx="3" data-pptx-bounds="420 532 440 36">
    <text id="cover-date-carrier" data-pptx-carrier="true" x="640" y="556" text-anchor="middle" fill="#C7D9EC" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17">{{DATE}}</text>
  </g>
</svg>
