  font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif"
  data-pptx-master="cmic_dark_arch_master" data-pptx-master-name="CMIC Dark Arch"
  data-pptx-layout="content" data-pptx-layout-name="Dark Architecture">
  <defs>
    <linearGradient id="darkLeftPanelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#13386B" stop-opacity="0.72" />
      <stop offset="100%" stop-color="#091D3D" stop-opacity="0.86" />
    </linearGradient>
    <linearGradient id="darkMidArrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D547E" />
      <stop offset="100%" stop-color="#DCEAF9" />
