    <linearGradient id="darkConeGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00B0F0" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#00B0F0" stop-opacity="0" />
