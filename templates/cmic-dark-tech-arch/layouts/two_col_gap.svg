<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
  lang="zh-CN" width="1280" height="720" viewBox="0 0 1280 720"
  font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif"
  data-pptx-master="cmic_dark_arch_master" data-pptx-master-name="CMIC Dark Arch"
  data-pptx-layout="content" data-pptx-layout-name="Dark Architecture">
  <defs>
    <linearGradient id="darkGapArrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <image id="dark-arch-bg" x="0" y="0" width="1280" height="720"
    href="../images/bg_dark_tech.png" preserveAspectRatio="none"
    data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="dark-arch-top-line" x="140" y="108" width="1000" height="2" fill="#65BCEB" fill-opacity="0.55"
    data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="dark-arch-bot-line" x="140" y="196" width="1000" height="1.5" fill="#408FB3" fill-opacity="0.5"
    data-pptx-layer="master" data-pptx-editable="false"/>

  <g id="content-title-slot" data-pptx-placeholder="title" data-pptx-bounds="64 26 1152 68">
    <text id="content-title-carrier" data-pptx-carrier="true" x="640" y="76" text-anchor="middle" fill="#FFFFFF" font-size="33" font-weight="700">{{TITLE}}</text>
  </g>
  <g id="content-takeaway-slot" data-pptx-placeholder="body" data-pptx-idx="1" data-pptx-bounds="80 116 1120 74">
    <text id="content-takeaway-carrier" data-pptx-carrier="true" x="640" y="144" text-anchor="middle" fill="#F4F7FC" font-size="18.5" font-weight="700">{{TAKEAWAY}}</text>
  </g>

  <g id="content-object-slot" data-pptx-placeholder="object" data-pptx-idx="2" data-pptx-binding="proxy" data-pptx-bounds="32 212 1216 474">
    <!-- 左卡 -->
    <rect x="32" y="218" width="576" height="332" rx="16" fill="#122854" fill-opacity="0.80" stroke="#3B6CB7" stroke-width="1.3" />
    <text x="58" y="256" font-size="18" font-weight="700" fill="#FFFFFF">{{LEFT_HEADER}}</text>

    <rect x="54" y="276" width="532" height="80" rx="10" fill="#0E2046" stroke="#2A4C87" stroke-width="1" />
    <text x="72" y="303" font-size="15" font-weight="700" fill="#FFFFFF">{{L1_T}}</text>
    <text x="72" y="326" font-size="13" fill="#B8CCE8">{{L1_B}}</text>

    <rect x="54" y="368" width="532" height="80" rx="10" fill="#0E2046" stroke="#2A4C87" stroke-width="1" />
    <text x="72" y="395" font-size="15" font-weight="700" fill="#FFFFFF">{{L2_T}}</text>
    <text x="72" y="418" font-size="13" fill="#B8CCE8">{{L2_B}}</text>

    <rect x="54" y="460" width="532" height="76" rx="10" fill="#0E2046" stroke="#2A4C87" stroke-width="1" />
    <text x="72" y="487" font-size="15" font-weight="700" fill="#FFFFFF">{{L3_T}}</text>
    <text x="72" y="510" font-size="13" fill="#B8CCE8">{{L3_B}}</text>

    <!-- 中间箭头 -->
    <polygon points="614,356 648,356 648,338 678,384 648,430 648,412 614,412" fill="url(#darkGapArrowGrad)" />
    <text x="642" y="390" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">{{ARROW_LABEL}}</text>

    <!-- 右卡 -->
    <rect x="684" y="218" width="564" height="332" rx="16" fill="#122854" fill-opacity="0.80" stroke="#3B6CB7" stroke-width="1.3" />
    <text x="710" y="256" font-size="18" font-weight="700" fill="#FFFFFF">{{RIGHT_HEADER}}</text>

    <rect x="708" y="276" width="516" height="80" rx="10" fill="#0E2046" stroke="#2A4C87" stroke-width="1" />
    <text x="780" y="322" font-size="17" font-weight="700" fill="#38BDF8" text-anchor="middle">{{R1_TAG}}</text>
    <line x1="852" y1="292" x2="852" y2="340" stroke="#3B6CB7" stroke-width="1.2" />
    <text x="872" y="311" font-size="15" fill="#E6F0FF">{{R1_B}}</text>

    <rect x="708" y="368" width="516" height="80" rx="10" fill="#0E2046" stroke="#2A4C87" stroke-width="1" />
    <text x="780" y="414" font-size="17" font-weight="700" fill="#38BDF8" text-anchor="middle">{{R2_TAG}}</text>
    <line x1="852" y1="384" x2="852" y2="432" stroke="#3B6CB7" stroke-width="1.2" />
    <text x="872" y="403" font-size="15" fill="#E6F0FF">{{R2_B}}</text>

    <rect x="708" y="460" width="516" height="76" rx="10" fill="#0E2046" stroke="#2A4C87" stroke-width="1" />
    <text x="780" y="504" font-size="17" font-weight="700" fill="#38BDF8" text-anchor="middle">{{R3_TAG}}</text>
    <line x1="852" y1="474" x2="852" y2="522" stroke="#3B6CB7" stroke-width="1.2" />
    <text x="872" y="493" font-size="15" fill="#E6F0FF">{{R3_B}}</text>

    <!-- 底部双行收束 -->
    <polygon points="560,564 720,564 640,586" fill="#00B0F0" fill-opacity="0.45" />
    <text x="640" y="624" font-size="20" font-weight="700" fill="#E6F0FF" text-anchor="middle">{{BOTTOM_L1}}</text>
    <text x="640" y="660" font-size="19" font-weight="700" fill="#FF8585" text-anchor="middle">{{BOTTOM_L2}}</text>
  </g>

  <g id="content-slide-number-slot" data-pptx-placeholder="slide-number" data-pptx-idx="3" data-pptx-bounds="1208 682 56 32">
    <text id="content-slide-number-carrier" data-pptx-carrier="true" x="1256" y="704" text-anchor="end" fill="#C7D9EC" font-family="Arial, sans-serif" font-size="15" font-weight="700">{{PAGE_NUM}}</text>
  </g>
</svg>
