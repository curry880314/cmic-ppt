<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
  lang="zh-CN" width="1280" height="720" viewBox="0 0 1280 720"
  font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif"
  data-pptx-master="obs_content_master" data-pptx-master-name="Obsidian Content Master"
  data-pptx-layout="content" data-pptx-layout-name="Obsidian Content">
  <rect id="obs-bg" x="0" y="0" width="1280" height="720" fill="#090B10" data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="obs-top-stripe" x="0" y="0" width="1280" height="3" fill="#10B981" data-pptx-layer="master" data-pptx-editable="false"/>
  <line id="obs-hdr-line" x1="40" y1="86" x2="1240" y2="86" stroke="#1E2534" stroke-width="1.2" data-pptx-layer="master" data-pptx-editable="false"/>

  <g id="obs-tag-slot" data-pptx-placeholder="body" data-pptx-idx="1" data-pptx-bounds="40 16 420 24">
    <text id="obs-tag-carrier" data-pptx-carrier="true" x="40" y="34" fill="#34D399" font-family="Consolas, Arial, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="700">{{SYS_TAG}}</text>
  </g>
  <g id="obs-title-slot" data-pptx-placeholder="title" data-pptx-bounds="40 38 1160 46">
    <text id="obs-title-carrier" data-pptx-carrier="true" x="40" y="74" fill="#F8FAFC" font-size="26" font-weight="700">{{TITLE}}</text>
  </g>
  <g id="obs-takeaway-slot" data-pptx-placeholder="body" data-pptx-idx="2" data-pptx-bounds="40 94 1200 54">
    <text id="obs-takeaway-carrier" data-pptx-carrier="true" x="40" y="116" fill="#CBD5E1" font-size="15.5" font-weight="700">{{TAKEAWAY}}</text>
  </g>

  <g id="obs-object-slot" data-pptx-placeholder="object" data-pptx-idx="3" data-pptx-binding="proxy" data-pptx-bounds="40 156 1200 526">
    <!-- 左轨 -->
    <rect x="40" y="160" width="588" height="440" rx="12" fill="#11151E" stroke="#10B981" stroke-width="1.2" />
    <rect x="40" y="160" width="588" height="54" rx="10" fill="#0B1F1A" />
    <text x="66" y="182" font-size="11.5" font-weight="700" fill="#34D399">{{L_TAG}}</text>
    <text x="66" y="204" font-size="17" font-weight="700" fill="#FFFFFF">{{L_H}}</text>
    <text x="604" y="196" font-size="13.5" font-weight="700" fill="#34D399" text-anchor="end">{{L_METRIC}}</text>

    <text x="66" y="246" font-size="15" font-weight="700" fill="#34D399">01  {{L1_T}}</text>
    <text x="66" y="270" font-size="13" fill="#CBD5E1">{{L1_B}}</text>
    <line x1="66" y1="308" x2="604" y2="308" stroke="#1E2534" stroke-width="1" />

    <text x="66" y="338" font-size="15" font-weight="700" fill="#34D399">02  {{L2_T}}</text>
    <text x="66" y="362" font-size="13" fill="#CBD5E1">{{L2_B}}</text>
    <line x1="66" y1="400" x2="604" y2="400" stroke="#1E2534" stroke-width="1" />

    <text x="66" y="430" font-size="15" font-weight="700" fill="#34D399">03  {{L3_T}}</text>
    <text x="66" y="454" font-size="13" fill="#CBD5E1">{{L3_B}}</text>
    <line x1="66" y1="492" x2="604" y2="492" stroke="#1E2534" stroke-width="1" />

    <text x="66" y="522" font-size="15" font-weight="700" fill="#34D399">04  {{L4_T}}</text>
    <text x="66" y="546" font-size="13" fill="#CBD5E1">{{L4_B}}</text>

    <!-- 右轨 -->
    <rect x="652" y="160" width="588" height="440" rx="12" fill="#11151E" stroke="#222938" stroke-width="1.2" />
    <rect x="652" y="160" width="588" height="54" rx="10" fill="#151B27" />
    <text x="678" y="182" font-size="11.5" font-weight="700" fill="#F59E0B">{{R_TAG}}</text>
    <text x="678" y="204" font-size="17" font-weight="700" fill="#FFFFFF">{{R_H}}</text>
    <text x="1216" y="196" font-size="13.5" font-weight="700" fill="#F59E0B" text-anchor="end">{{R_METRIC}}</text>

    <text x="678" y="246" font-size="15" font-weight="700" fill="#F59E0B">01  {{R1_T}}</text>
    <text x="678" y="270" font-size="13" fill="#CBD5E1">{{R1_B}}</text>
    <line x1="678" y1="308" x2="1216" y2="308" stroke="#1E2534" stroke-width="1" />

    <text x="678" y="338" font-size="15" font-weight="700" fill="#F59E0B">02  {{R2_T}}</text>
    <text x="678" y="362" font-size="13" fill="#CBD5E1">{{R2_B}}</text>
    <line x1="678" y1="400" x2="1216" y2="400" stroke="#1E2534" stroke-width="1" />

    <text x="678" y="430" font-size="15" font-weight="700" fill="#F59E0B">03  {{R3_T}}</text>
    <text x="678" y="454" font-size="13" fill="#CBD5E1">{{R3_B}}</text>
    <line x1="678" y1="492" x2="1216" y2="492" stroke="#1E2534" stroke-width="1" />

    <text x="678" y="522" font-size="15" font-weight="700" fill="#F59E0B">04  {{R4_T}}</text>
    <text x="678" y="546" font-size="13" fill="#CBD5E1">{{R4_B}}</text>

    <!-- 底部状态条 -->
    <rect x="40" y="616" width="1200" height="58" rx="10" fill="#0B1F1A" stroke="#10B981" stroke-width="1.2" />
    <rect x="56" y="630" width="136" height="30" rx="6" fill="#10B981" />
    <text x="124" y="650" font-size="13.5" font-weight="700" fill="#090B10" text-anchor="middle">{{STATUS_TAG}}</text>
    <text x="214" y="651" font-size="15" font-weight="700" fill="#F8FAFC">{{STATUS_TEXT}}</text>
  </g>

  <g id="obs-page-slot" data-pptx-placeholder="slide-number" data-pptx-idx="4" data-pptx-bounds="1192 686 48 28">
    <text id="obs-page-carrier" data-pptx-carrier="true" x="1240" y="706" text-anchor="end" fill="#64748B" font-family="Consolas, Arial, sans-serif" font-size="13" font-weight="700">{{PAGE_NUM}}</text>
  </g>
</svg>
